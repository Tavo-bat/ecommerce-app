<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Inicia sesión en TavoShop para acceder a tu cuenta y gestionar tus pedidos.">
    <title>Iniciar Sesión — TavoShop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <a href="index.html" class="back-link">← Volver a TavoShop</a>
            <h1>Iniciar Sesión</h1>
            <form id="login-form" novalidate>
                <div class="input-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" name="email" placeholder="tu@correo.com" required autocomplete="email">
                </div>
                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn-login">Iniciar Sesión</button>
            </form>
            <div class="extra-links">
                <a href="#recuperar">¿Olvidaste tu contraseña?</a>
                <p>¿No tienes una cuenta? <a href="register.html">Inscríbete aquí</a></p>
            </div>
        </div>
    </div>
</body>
</html>
